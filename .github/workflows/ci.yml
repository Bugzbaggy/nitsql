name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyzer:
    name: Analyzer self-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Analyzer runs
        run: python scripts/analyze_sql.py --help

      - name: Detects known-bad fixtures
        run: |
          out=$(python scripts/analyze_sql.py --json test-app/sql/ || true)
          echo "$out" | head -40
          if ! echo "$out" | grep -q CRITICAL; then
            echo "::error::analyzer found no CRITICAL findings in the bad-SQL corpus"
            exit 1
          fi
          echo 'Analyzer flagged the fixtures as expected.'

  rule-counts:
    name: Rule-count claims match source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify README.md / SKILL.md rule counts against source
        run: python scripts/check_rule_counts.py

  hooks:
    name: Pre-commit hook tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run hook tests
        run: bats hooks/tests/

  leak-scan:
    name: No internal identifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leak scan self-test
        run: bash ci/leak-scan.test.sh
      - name: Scan
        env:
          # Named terms live in repository secrets, never in this public file.
          # Fork pull requests get no secrets, so only trusted runs require them.
          LEAK_EXTRA_PAT: ${{ secrets.LEAK_EXTRA_PAT }}
          LEAK_EXTRA_PAT_CS: ${{ secrets.LEAK_EXTRA_PAT_CS }}
          LEAK_REQUIRE_EXTRAS: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: bash ci/leak-scan.sh
