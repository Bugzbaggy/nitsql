name: sql-valid8

# ---------------------------------------------------------------------------
# sql-valid8 — authoritative SQL gate (TEMPLATE)
# ---------------------------------------------------------------------------
# Copy this file to `.github/workflows/sql-valid8.yml` in a database repo.
#
# It runs the sql-valid8 multi-dialect analyzer against the *.sql files
# changed in a PR (or pushed to master) and fails the job on any CRITICAL
# finding. Unlike the local pre-commit hook — which a developer can skip
# (`--no-verify`) or simply never install — this gate runs server-side and
# cannot be bypassed.
#
# The analyzer auto-detects the dialect of every file (MSSQL / PostgreSQL /
# Oracle / MySQL / SQLite), so this single workflow covers all platforms.
#
# DEPLOYMENT — the workflow needs analyze_sql.py present in the repo. Pick one:
#
#   A. Vendored (recommended, self-contained):
#      Copy plugins/sql-valid8/scripts/analyze_sql.py into the repo at
#      `.githooks/analyze_sql.py` and keep ANALYZER below as-is. Re-copy on
#      each sql-valid8 release so CI and the local hook stay in lockstep.
#
#   B. Marketplace checkout:
#      Add a second `actions/checkout` step for example/claude-marketplace and
#      set ANALYZER to that path, e.g.
#        plugins/sql-valid8/scripts/analyze_sql.py
#
# Suppress individual findings inline with pragmas (no config file needed):
#   -- sql-valid8:ignore                 (whole line)
#   -- sql-valid8:ignore=SA0002          (one rule on the line)
#   -- sql-valid8:ignore-file=SA0008     (one rule for the whole file)
# ---------------------------------------------------------------------------

on:
  pull_request:
    paths:
      - '**/*.sql'
      - '.githooks/analyze_sql.py'
      - '.github/workflows/sql-valid8.yml'
  push:
    branches:
      - master
    paths:
      - '**/*.sql'
      - '.githooks/analyze_sql.py'
      - '.github/workflows/sql-valid8.yml'
  workflow_dispatch:

permissions:
  # Read-only: the job writes a run summary via $GITHUB_STEP_SUMMARY and does
  # not post PR comments. If you wire up an actual PR-comment step, add
  # `pull-requests: write` back.
  contents: read

env:
  # Path to the analyzer inside this repo. Change for deployment model B.
  ANALYZER: .githooks/analyze_sql.py

jobs:
  analyze:
    name: Analyze changed SQL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine changed *.sql files
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            FILES=$(git ls-files '*.sql')
          else
            FILES=$(git diff --name-only --diff-filter=AMR "$BASE_SHA" "$HEAD_SHA" -- '*.sql')
          fi

          if [ -z "$FILES" ]; then
            echo "no_files=true" >> "$GITHUB_OUTPUT"
            echo "No SQL files changed — nothing to analyze."
          else
            echo "no_files=false" >> "$GITHUB_OUTPUT"
            echo "$FILES" > "$RUNNER_TEMP/sql_files.txt"
            COUNT=$(wc -l < "$RUNNER_TEMP/sql_files.txt")
            echo "Found $COUNT changed SQL file(s)."
          fi

      - name: Verify analyzer is present
        if: steps.changed.outputs.no_files == 'false'
        shell: bash
        run: |
          if [ ! -f "$ANALYZER" ]; then
            echo "::error::$ANALYZER missing — vendor analyze_sql.py from sql-valid8 (v7.0.0+) or switch to the marketplace-checkout deployment."
            exit 1
          fi

      - name: Run sql-valid8 analyzer
        if: steps.changed.outputs.no_files == 'false'
        id: analyze
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FILES < "$RUNNER_TEMP/sql_files.txt"
          echo "Analyzing ${#FILES[@]} file(s):"
          printf '  %s\n' "${FILES[@]}"
          echo ""

          # The analyzer exits nonzero on CRITICAL findings (expected) AND on a
          # genuine crash. Distinguish them by whether valid JSON was produced:
          # a crash leaves the file empty/unparseable, so fail with a clear
          # message instead of a confusing "integer expression expected" later.
          set +e
          python "$ANALYZER" --json "${FILES[@]}" > "$RUNNER_TEMP/sql_valid8.json"
          ANALYZER_EXIT=$?
          set -e

          if ! python -c 'import json,sys; json.load(open(sys.argv[1]))' "$RUNNER_TEMP/sql_valid8.json" 2>/dev/null; then
            echo "::error::sql-valid8 analyzer failed (exit $ANALYZER_EXIT) — no valid JSON produced. See the analyzer output above."
            exit 1
          fi

          echo "────────────────────────────────────────────────────────────"
          python "$ANALYZER" --fix "${FILES[@]}" || true
          echo "────────────────────────────────────────────────────────────"

          read TOTAL CRIT HIGH MED LOW <<<"$(python -c '
          import json, sys
          d = json.load(open(sys.argv[1]))
          c = d.get("severity_counts", {})
          print(d.get("total_violations", 0), c.get("CRITICAL", 0), c.get("HIGH", 0), c.get("MEDIUM", 0), c.get("LOW", 0))
          ' "$RUNNER_TEMP/sql_valid8.json")"

          {
            echo "total=$TOTAL"
            echo "critical=$CRIT"
            echo "high=$HIGH"
            echo "medium=$MED"
            echo "low=$LOW"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## sql-valid8 results"
            echo ""
            echo "| Severity | Count |"
            echo "| -------- | ----- |"
            echo "| CRITICAL | $CRIT |"
            echo "| HIGH     | $HIGH |"
            echo "| MEDIUM   | $MED  |"
            echo "| LOW      | $LOW  |"
            echo "| **Total**| **$TOTAL** |"
            echo ""
            if [ "$CRIT" -gt 0 ]; then
              echo "**Status:** :x: BLOCKED — $CRIT CRITICAL finding(s)."
            elif [ "$TOTAL" -gt 0 ]; then
              echo "**Status:** :warning: $TOTAL non-critical finding(s) — merge allowed."
            else
              echo "**Status:** :white_check_mark: All clean."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CRIT" -gt 0 ]; then
            echo "::error::sql-valid8 BLOCKED — $CRIT CRITICAL finding(s) in changed SQL."
            exit 1
          fi

      - name: All clean
        if: steps.changed.outputs.no_files == 'true'
        shell: bash
        run: echo "No SQL files in this change — sql-valid8 skipped."
